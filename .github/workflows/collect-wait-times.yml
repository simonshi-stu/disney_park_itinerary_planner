name: Collect wait times

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "collect is the normal collector; audit-hosted-backfill is read-only"
        required: true
        default: collect
        type: choice
        options:
          - collect
          - audit-hosted-backfill
      confirm_validation_target:
        description: "Required only for audit-hosted-backfill; type validation-only"
        required: false
        type: string
      date:
        description: "Optional backfill service date (YYYY-MM-DD); empty means all Git archives"
        required: false
        type: string
  repository_dispatch:
    types: [collect-wait-times]
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: collect-wait-times
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.operation == 'collect' || inputs.operation == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Collect Queue Times snapshots
        id: collect
        continue-on-error: true
        env:
          MIN_SNAPSHOT_INTERVAL_MINUTES: "5"
        run: |
          set +e
          before_snapshot_hash="$(sha256sum data/wait_times/latest_snapshot.json 2>/dev/null | cut -d' ' -f1)"
          node scripts/collect-wait-times.mjs 2> "$RUNNER_TEMP/collector-error.log"
          status=$?
          after_snapshot_hash="$(sha256sum data/wait_times/latest_snapshot.json 2>/dev/null | cut -d' ' -f1)"
          if [ "$status" -eq 0 ] && [ -n "$after_snapshot_hash" ] && [ "$before_snapshot_hash" != "$after_snapshot_hash" ]; then
            echo "snapshot_written=true" >> "$GITHUB_OUTPUT"
          else
            echo "snapshot_written=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$status" -ne 0 ]; then
            failure_message="$(tr -d '\r\n' < "$RUNNER_TEMP/collector-error.log" | cut -c1-500)"
            if [ -z "$failure_message" ]; then
              failure_message="collector step failed before a snapshot was written"
            fi
            printf 'failure_message=%s\n' "$failure_message" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
      - name: Commit updated wait-time data
        id: git_fallback
        if: ${{ steps.collect.outcome == 'success' && steps.collect.outputs.snapshot_written == 'true' }}
        continue-on-error: true
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Collect wait-time snapshot"
          file_pattern: data/wait_times/*.csv data/wait_times/latest_snapshot.json
      - name: Prepare normalized-only hosted inputs
        id: dual_write_inputs
        # Human gate: only when COLLECTOR_DUAL_WRITE_ENABLED is exactly true materialize
        # reviewed inputs from non-secret Variables and the validation authorization from
        # an encrypted Secret into 0600 files under RUNNER_TEMP. Each JSON input accepts
        # either plain JSON object text or "gzip-base64:" + base64(gzip(JSON)) to fit the
        # 48 KiB Actions Variable limit. Values are never echoed and only the ephemeral
        # file paths leave this step via GITHUB_OUTPUT.
        if: ${{ always() && (steps.collect.outcome == 'failure' || (steps.collect.outcome == 'success' && steps.collect.outputs.snapshot_written == 'true')) }}
        env:
          COLLECTOR_DUAL_WRITE_ENABLED: ${{ vars.COLLECTOR_DUAL_WRITE_ENABLED || 'false' }}
          NORMALIZED_ONLY_REVIEWED_CATALOG_JSON: ${{ vars.COLLECTOR_DUAL_WRITE_ENABLED == 'true' && vars.NORMALIZED_ONLY_REVIEWED_CATALOG_JSON || '' }}
          NORMALIZED_ONLY_ACCESS_MODE_MAPPING_JSON: ${{ vars.COLLECTOR_DUAL_WRITE_ENABLED == 'true' && vars.NORMALIZED_ONLY_ACCESS_MODE_MAPPING_JSON || '' }}
          NORMALIZED_ONLY_AUTHORIZATION_JSON: ${{ vars.COLLECTOR_DUAL_WRITE_ENABLED == 'true' && secrets.NORMALIZED_ONLY_AUTHORIZATION_JSON || '' }}
        run: |
          set -euo pipefail
          if [ "$COLLECTOR_DUAL_WRITE_ENABLED" != "true" ]; then
            printf 'reviewed_catalog_path=\naccess_mode_mapping_path=\nauthorization_path=\n' >> "$GITHUB_OUTPUT"
            echo "Normalized-only dual-write is disabled; no hosted input files were materialized."
            exit 0
          fi
          umask 077
          input_dir="$(mktemp -d "$RUNNER_TEMP/normalized-only-inputs-XXXXXXXX")"
          reviewed_catalog_path="$input_dir/reviewed-catalog.json"
          access_mode_mapping_path="$input_dir/access-mode-mapping.json"
          authorization_path="$input_dir/authorization.json"
          REVIEWED_CATALOG_PATH="$reviewed_catalog_path" \
          ACCESS_MODE_MAPPING_PATH="$access_mode_mapping_path" \
          AUTHORIZATION_PATH="$authorization_path" \
          node <<'NODE'
          const { writeFileSync } = require("node:fs");
          const { gunzipSync } = require("node:zlib");

          const GZIP_BASE64_PREFIX = "gzip-base64:";
          const MAX_DECOMPRESSED_BYTES = 1024 * 1024;

          function decodeInput(name, raw) {
            if (typeof raw !== "string" || raw.trim() === "") {
              throw new Error(`${name} must be a nonempty GitHub Variable or Secret before the sidecar can run`);
            }
            let jsonText = raw;
            if (raw.startsWith(GZIP_BASE64_PREFIX)) {
              const encoded = raw.slice(GZIP_BASE64_PREFIX.length);
              if (encoded === "" || !/^[A-Za-z0-9+/]+={0,2}$/.test(encoded)) {
                throw new Error(`${name} gzip-base64 payload is not valid base64`);
              }
              const unpadded = encoded.replace(/=+$/, "");
              if (unpadded.length % 4 === 1) {
                throw new Error(`${name} gzip-base64 payload is not valid base64`);
              }
              const compressed = Buffer.from(unpadded, "base64");
              if (compressed.length === 0 || compressed.toString("base64").replace(/=+$/, "") !== unpadded) {
                throw new Error(`${name} gzip-base64 payload is not valid base64`);
              }
              let decompressed;
              try {
                decompressed = gunzipSync(compressed, { maxOutputLength: MAX_DECOMPRESSED_BYTES });
              } catch {
                throw new Error(`${name} gzip-base64 payload could not be gunzipped within the ${MAX_DECOMPRESSED_BYTES} byte decompressed limit`);
              }
              if (decompressed.length === 0) {
                throw new Error(`${name} gzip-base64 payload decompressed to an empty value`);
              }
              try {
                jsonText = new TextDecoder("utf-8", { fatal: true }).decode(decompressed);
              } catch {
                throw new Error(`${name} gzip-base64 payload is not valid UTF-8`);
              }
            }
            let parsed;
            try {
              parsed = JSON.parse(jsonText);
            } catch {
              throw new Error(`${name} must contain valid JSON before the sidecar can run`);
            }
            if (parsed === null || typeof parsed !== "object" || Array.isArray(parsed)) {
              throw new Error(`${name} must contain a JSON object before the sidecar can run`);
            }
            return parsed;
          }

          const inputs = [
            ["NORMALIZED_ONLY_REVIEWED_CATALOG_JSON", process.env.REVIEWED_CATALOG_PATH],
            ["NORMALIZED_ONLY_ACCESS_MODE_MAPPING_JSON", process.env.ACCESS_MODE_MAPPING_PATH],
            ["NORMALIZED_ONLY_AUTHORIZATION_JSON", process.env.AUTHORIZATION_PATH]
          ];
          for (const [name, filePath] of inputs) {
            const parsed = decodeInput(name, process.env[name]);
            writeFileSync(filePath, `${JSON.stringify(parsed)}\n`, { mode: 0o600, flag: "wx" });
          }
          NODE
          {
            printf 'reviewed_catalog_path=%s\n' "$reviewed_catalog_path"
            printf 'access_mode_mapping_path=%s\n' "$access_mode_mapping_path"
            printf 'authorization_path=%s\n' "$authorization_path"
          } >> "$GITHUB_OUTPUT"
      - name: Surface hosted input preparation failure
        if: ${{ failure() && steps.dual_write_inputs.outcome == 'failure' }}
        run: |
          echo "Normalized-only hosted input preparation failed before any cloud connection; the Git fallback commit above is unaffected. Configure the NORMALIZED_ONLY_* Variables/Secret and re-run." >&2
          exit 1
      - name: Normalized-only dual-write sidecar (opt-in, disabled by default)
        id: dual_write
        # Human gate: enabling COLLECTOR_DUAL_WRITE_ENABLED selects the normalized-only
        # hosted leg. No sidecar path applies migrations: the normalized-only path
        # requires an already-applied 0004, and the source-health fallback requires the
        # same current validation-only authorization/target fingerprint and writes only
        # when ingestion.source_health already exists. With the flag disabled this step
        # receives no cloud env at all. The sidecar runs only after input preparation
        # succeeded, so a materialization failure never reaches R2/Neon.
        if: ${{ always() && steps.dual_write_inputs.outcome == 'success' && (steps.collect.outcome == 'failure' || (steps.collect.outcome == 'success' && steps.collect.outputs.snapshot_written == 'true')) }}
        continue-on-error: true
        env:
          COLLECTOR_DUAL_WRITE_ENABLED: ${{ vars.COLLECTOR_DUAL_WRITE_ENABLED || 'false' }}
          COLLECTOR_RUN_ID: ${{ github.run_id }}
          COLLECTOR_RUN_OUTCOME: ${{ steps.collect.outcome }}
          COLLECTOR_SOURCE_FAILURE: ${{ steps.collect.outputs.failure_message || 'collector step failed before a snapshot was written' }}
          COLLECTOR_GIT_FALLBACK_OUTCOME: ${{ steps.git_fallback.outcome || 'not_attempted' }}
          DATABASE_URL: ${{ vars.COLLECTOR_DUAL_WRITE_ENABLED == 'true' && secrets.DATABASE_URL || '' }}
          RAW_ARCHIVE_BUCKET: ${{ vars.COLLECTOR_DUAL_WRITE_ENABLED == 'true' && vars.RAW_ARCHIVE_BUCKET || '' }}
          RAW_ARCHIVE_ENDPOINT: ${{ vars.COLLECTOR_DUAL_WRITE_ENABLED == 'true' && vars.RAW_ARCHIVE_ENDPOINT || '' }}
          AWS_REGION: ${{ vars.COLLECTOR_DUAL_WRITE_ENABLED == 'true' && (vars.AWS_REGION || 'us-west-2') || '' }}
          AWS_ACCESS_KEY_ID: ${{ vars.COLLECTOR_DUAL_WRITE_ENABLED == 'true' && secrets.AWS_ACCESS_KEY_ID || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ vars.COLLECTOR_DUAL_WRITE_ENABLED == 'true' && secrets.AWS_SECRET_ACCESS_KEY || '' }}
          NORMALIZED_ONLY_REVIEWED_CATALOG_PATH: ${{ vars.COLLECTOR_DUAL_WRITE_ENABLED == 'true' && steps.dual_write_inputs.outputs.reviewed_catalog_path || '' }}
          NORMALIZED_ONLY_ACCESS_MODE_MAPPING_PATH: ${{ vars.COLLECTOR_DUAL_WRITE_ENABLED == 'true' && steps.dual_write_inputs.outputs.access_mode_mapping_path || '' }}
          NORMALIZED_ONLY_AUTHORIZATION_PATH: ${{ vars.COLLECTOR_DUAL_WRITE_ENABLED == 'true' && steps.dual_write_inputs.outputs.authorization_path || '' }}
          NORMALIZED_ONLY_EXPECTED_TARGET_SHA256: ${{ vars.COLLECTOR_DUAL_WRITE_ENABLED == 'true' && vars.NORMALIZED_ONLY_EXPECTED_TARGET_SHA256 || '' }}
        run: node workers/collector/run-dual-write.mjs
      - name: Surface dual-write failure
        if: ${{ steps.dual_write.outcome == 'failure' }}
        run: |
          echo "Normalized-only dual-write step failed; see the redacted reason in the sidecar output above." >&2
          exit 1
      - name: Preserve collector failure status
        if: ${{ steps.collect.outcome == 'failure' }}
        run: exit 1

  audit-target-gate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'audit-hosted-backfill' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit read-only audit confirmation
        # The legacy raw write job was removed; this path only runs the read-only
        # hosted backfill report. The old validation branch expired 2026-09-30.
        env:
          CONFIRMATION: ${{ inputs.confirm_validation_target }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "validation-only" || {
            echo "The read-only audit confirmation must be exactly validation-only." >&2
            exit 1
          }

  audit-hosted-backfill:
    needs: audit-target-gate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'audit-hosted-backfill' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RAW_ARCHIVE_BUCKET: ${{ vars.RAW_ARCHIVE_BUCKET }}
      RAW_ARCHIVE_ENDPOINT: ${{ vars.RAW_ARCHIVE_ENDPOINT }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      HOSTED_TARGET_LABEL: neon-validation-branch-only
      BACKFILL_DATE: ${{ inputs.date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Read-only Git, Neon, R2 and lineage audit
        run: |
          set -euo pipefail
          if [[ -n "$BACKFILL_DATE" && ! "$BACKFILL_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "date must be YYYY-MM-DD" >&2
            exit 1
          fi
          if [[ -n "$BACKFILL_DATE" ]]; then
            node scripts/report-hosted-backfill.mjs --date="$BACKFILL_DATE" > hosted-backfill-report.json
          else
            node scripts/report-hosted-backfill.mjs > hosted-backfill-report.json
          fi
          cat hosted-backfill-report.json
      - name: Retain read-only audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hosted-backfill-audit-${{ github.run_id }}
          if-no-files-found: warn
          path: hosted-backfill-report.json
