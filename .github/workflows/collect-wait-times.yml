name: Collect wait times

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "collect is the normal collector; backfill-hosted-validation writes; audit-hosted-backfill is read-only"
        required: true
        default: collect
        type: choice
        options:
          - collect
          - backfill-hosted-validation
          - audit-hosted-backfill
      confirm_validation_target:
        description: "Required only for backfill-hosted-validation; type validation-only"
        required: false
        type: string
      date:
        description: "Optional backfill service date (YYYY-MM-DD); empty means all Git archives"
        required: false
        type: string
  repository_dispatch:
    types: [collect-wait-times]
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: collect-wait-times
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.operation == 'collect' || inputs.operation == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Collect Queue Times snapshots
        id: collect
        continue-on-error: true
        env:
          MIN_SNAPSHOT_INTERVAL_MINUTES: "5"
        run: |
          set +e
          before_snapshot_hash="$(sha256sum data/wait_times/latest_snapshot.json 2>/dev/null | cut -d' ' -f1)"
          node scripts/collect-wait-times.mjs 2> "$RUNNER_TEMP/collector-error.log"
          status=$?
          after_snapshot_hash="$(sha256sum data/wait_times/latest_snapshot.json 2>/dev/null | cut -d' ' -f1)"
          if [ "$status" -eq 0 ] && [ -n "$after_snapshot_hash" ] && [ "$before_snapshot_hash" != "$after_snapshot_hash" ]; then
            echo "snapshot_written=true" >> "$GITHUB_OUTPUT"
          else
            echo "snapshot_written=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$status" -ne 0 ]; then
            failure_message="$(tr -d '\r\n' < "$RUNNER_TEMP/collector-error.log" | cut -c1-500)"
            if [ -z "$failure_message" ]; then
              failure_message="collector step failed before a snapshot was written"
            fi
            printf 'failure_message=%s\n' "$failure_message" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
      - name: Commit updated wait-time data
        id: git_fallback
        if: ${{ steps.collect.outcome == 'success' && steps.collect.outputs.snapshot_written == 'true' }}
        continue-on-error: true
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Collect wait-time snapshot"
          file_pattern: data/wait_times/*.csv data/wait_times/latest_snapshot.json
      - name: Dual-write collected snapshot
        id: dual_write
        if: ${{ always() && (steps.collect.outcome == 'failure' || (steps.collect.outcome == 'success' && steps.collect.outputs.snapshot_written == 'true')) }}
        continue-on-error: true
        env:
          COLLECTOR_DUAL_WRITE_ENABLED: ${{ vars.COLLECTOR_DUAL_WRITE_ENABLED || 'false' }}
          COLLECTOR_RUN_ID: ${{ github.run_id }}
          COLLECTOR_RUN_OUTCOME: ${{ steps.collect.outcome }}
          COLLECTOR_SOURCE_FAILURE: ${{ steps.collect.outputs.failure_message || 'collector step failed before a snapshot was written' }}
          COLLECTOR_GIT_FALLBACK_OUTCOME: ${{ steps.git_fallback.outcome || 'not_attempted' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RAW_ARCHIVE_BUCKET: ${{ vars.RAW_ARCHIVE_BUCKET }}
          RAW_ARCHIVE_ENDPOINT: ${{ vars.RAW_ARCHIVE_ENDPOINT }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: node workers/collector/run-dual-write.mjs
      - name: Surface dual-write failure
        if: ${{ steps.dual_write.outcome == 'failure' }}
        run: exit 1
      - name: Preserve collector failure status
        if: ${{ steps.collect.outcome == 'failure' }}
        run: exit 1

  backfill-target-gate:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.operation == 'backfill-hosted-validation' || inputs.operation == 'audit-hosted-backfill') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the validation branch and explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirm_validation_target }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/feat/04c-hosted-validation" || {
            echo "Hosted historical validation is restricted to feat/04c-hosted-validation." >&2
            exit 1
          }
          test "$CONFIRMATION" = "validation-only" || {
            echo "The confirmation must be exactly validation-only." >&2
            exit 1
          }

  backfill-hosted-validation:
    needs: backfill-target-gate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'backfill-hosted-validation' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RAW_ARCHIVE_BUCKET: ${{ vars.RAW_ARCHIVE_BUCKET }}
      RAW_ARCHIVE_ENDPOINT: ${{ vars.RAW_ARCHIVE_ENDPOINT }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      HOSTED_TARGET_LABEL: neon-validation-branch-only
      BACKFILL_DATE: ${{ inputs.date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Validate archive plan
        run: |
          set -euo pipefail
          if [[ -n "$BACKFILL_DATE" && ! "$BACKFILL_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "date must be YYYY-MM-DD" >&2
            exit 1
          fi
          if [[ -n "$BACKFILL_DATE" ]]; then
            node scripts/backfill-wait-times-to-postgres.mjs --check --date="$BACKFILL_DATE" > hosted-backfill-plan.json
          else
            node scripts/backfill-wait-times-to-postgres.mjs --check > hosted-backfill-plan.json
          fi
      - name: Upload immutable raw archives and replay PostgreSQL
        run: |
          set -euo pipefail
          if [[ -n "$BACKFILL_DATE" ]]; then
            node scripts/backfill-wait-times-to-postgres.mjs --date="$BACKFILL_DATE" > hosted-backfill-write.json
          else
            node scripts/backfill-wait-times-to-postgres.mjs > hosted-backfill-write.json
          fi
      - name: Verify Git, Neon, R2 and replay lineage
        run: |
          set -euo pipefail
          if [[ -n "$BACKFILL_DATE" ]]; then
            node scripts/report-hosted-backfill.mjs --date="$BACKFILL_DATE" > hosted-backfill-report.json
          else
            node scripts/report-hosted-backfill.mjs > hosted-backfill-report.json
          fi
          cat hosted-backfill-report.json
      - name: Retain machine-readable evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hosted-backfill-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            hosted-backfill-plan.json
            hosted-backfill-write.json
            hosted-backfill-report.json

  audit-hosted-backfill:
    needs: backfill-target-gate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'audit-hosted-backfill' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RAW_ARCHIVE_BUCKET: ${{ vars.RAW_ARCHIVE_BUCKET }}
      RAW_ARCHIVE_ENDPOINT: ${{ vars.RAW_ARCHIVE_ENDPOINT }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      HOSTED_TARGET_LABEL: neon-validation-branch-only
      BACKFILL_DATE: ${{ inputs.date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Read-only Git, Neon, R2 and lineage audit
        run: |
          set -euo pipefail
          if [[ -n "$BACKFILL_DATE" && ! "$BACKFILL_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "date must be YYYY-MM-DD" >&2
            exit 1
          fi
          if [[ -n "$BACKFILL_DATE" ]]; then
            node scripts/report-hosted-backfill.mjs --date="$BACKFILL_DATE" > hosted-backfill-report.json
          else
            node scripts/report-hosted-backfill.mjs > hosted-backfill-report.json
          fi
          cat hosted-backfill-report.json
      - name: Retain read-only audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hosted-backfill-audit-${{ github.run_id }}
          if-no-files-found: warn
          path: hosted-backfill-report.json
